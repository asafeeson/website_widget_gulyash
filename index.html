<!DOCTYPE html>
<html>
  <head>
    <!-- Google Tag Manager -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != "dataLayer" ? "&l=" + l : "";
        j.async = true;
        j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, "script", "dataLayer", "GTM-W742BKW");
    </script>
    <!-- End Google Tag Manager -->

    <script>
 
    </script>

    <title>Access JSON Data</title>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-W742BKW"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div id="data-container"></div>

    <script>
      // Функция для извлечения и отображения данных
      function getWidgetDataOne() {
        if (window.widgetDataOne) {
          return JSON.stringify(window.widgetDataOne, null, 2);
        } else {
          console.log("Variable 'widgetDataOne' not found in data layer.");
        }
      }

      function getWidgetDataTwo() {
        if (window.widgetDataTwo) {
          return JSON.stringify(window.widgetDataTwo, null, 2);
        } else {
          console.log("Variable 'widgetDataTwo' not found in data layer.");
        }
      }

      function displayJsonData() {
        // Проверяем, определена ли переменная window.myJsonData
        const widgetOne = getWidgetDataOne();
        const widgetTwo = getWidgetDataTwo();
        let dataContainer = document.getElementById("data-container");

        if (widgetOne) {
          let html = "<h2>Данные из JSON для первого виджета:</h2>";
          html += "<pre>" + widgetOne + "</pre>"; // Вывод JSON
          dataContainer.innerHTML = html;

          // Пример доступа к конкретным данным:
          var firstSlideTitle = window.myJsonData.slideOne.title;
          console.log("Title of the first slide:", firstSlideTitle); // Выводим в консоль для примера

          // Пример перебора слайдов
          for (var slideKey in window.myJsonData) {
            if (window.myJsonData.hasOwnProperty(slideKey)) {
              // Проверяем, является ли свойство собственным
              var slide = window.myJsonData[slideKey];
              console.log(slideKey, slide.title); // Выводим ключ слайда и заголовок
              // Здесь можно добавить код для отображения данных слайда на странице
            }
          }
        } else {
          console.error(
            "JSON data is not available.  Make sure the GTM tag has fired."
          );
          document.getElementById("data-container").innerHTML =
            "<p>Data not loaded.  Check console.</p>";
        }
        if (widgetTwo) {
          let html = "<h2>Данные из JSON для второго виджета:</h2>";
          html += "<pre>" + widgetTwo + "</pre>"; // Вывод JSON
          dataContainer.innerHTML = html;
        }
      }

      // Вызываем функцию после загрузки страницы.  Важно, чтобы GTM успел инициализироваться.
      window.onload = function () {
        displayJsonData();
      };
    </script>
  </body>
</html>
