<script>
    // Функция для создания HTML-элемента с заданными атрибутами
    function createElement(tagName, attributes = {}) {
      const element = document.createElement(tagName);
      for (const key in attributes) {
        if (key === 'style') {
          Object.assign(element.style, attributes[key]);
        } else {
          element.setAttribute(key, attributes[key]);
        }
      }
      return element;
    }
    
    // Функция для получения данных из GTM (Data Layer)
    function getGtmData(key, defaultValue = null) {
      if (window.dataLayer) {
        for (let i = window.dataLayer.length - 1; i >= 0; i--) {
          const layer = window.dataLayer[i];
          if (layer[key] !== undefined) {
            return layer[key];
          }
        }
      }
      return defaultValue;
    }
    
    // Функция для сохранения данных в LocalStorage
    function setLocalStorageData(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (error) {
        console.error('Failed to set local storage item:', error);
      }
    }
    
    // Функция для получения данных из LocalStorage
    function getLocalStorageData(key, defaultValue = null) {
      try {
        const item = localStorage.getItem(key);
        return item ? JSON.parse(item) : defaultValue;
      } catch (error) {
        console.error('Failed to get local storage item:', error);
        return defaultValue;
      }
    }
    
    // Основная функция виджета
    function initSmartWidget() {
      // 1. Получение конфигурации и контента из GTM Data Layer
      const defaultWidgetConfig = {
        buttonText: 'Узнать больше',
        buttonTextPromocode: 'Ваш промокод',
        defaultButtonText: 'Узнать больше', //Текст кнопки по умолчанию
        slides: [
          {
            title: 'Заголовок 1',
            description: 'Описание 1',
            buttonText: 'Далее',
            imageUrl: '',
          },
          {
            title: 'Заголовок 2',
            description: 'Описание 2',
            buttonText: 'Далее',
            imageUrl: '',
          },
          {
            title: 'Заголовок 3',
            description: 'Описание 3',
            buttonText: 'Получить Промокод',
            imageUrl: '',
            showPromocode: true,
          },
        ],
      };
    
      const defaultSourceRules = [
        {
          source: 'google',
          buttonText: 'Google Акция',
          slides: [
            {
              title: 'Google Заголовок 1',
              description: 'Google Описание 1',
              buttonText: 'Далее',
              imageUrl: '',
            },
            {
              title: 'Google Заголовок 2',
              description: 'Google Описание 2',
              buttonText: 'Далее',
              imageUrl: '',
            },
            {
              title: 'Google Заголовок 3',
              description: 'Google Описание 3',
              buttonText: 'Получить Промокод',
              imageUrl: '',
              showPromocode: true,
            },
          ],
        },
        {
          source: 'yandex',
          buttonText: 'Yandex Предложение',
          slides: [
            {
              title: 'Yandex Заголовок 1',
              description: 'Yandex Описание 1',
              buttonText: 'Далее',
              imageUrl: '',
            },
            {
              title: 'Yandex Заголовок 2',
              description: 'Yandex Описание 2',
              buttonText: 'Далее',
              imageUrl: '',
            },
            {
              title: 'Yandex Заголовок 3',
              description: 'Yandex Описание 3',
              buttonText: 'Получить Промокод',
              imageUrl: '',
              showPromocode: true,
            },
          ],
        },
      ];
    
      const defaultPromocode = 'SUPERCODE123';
    
      const widgetConfig = getGtmData('widgetConfig', defaultWidgetConfig);
      const sourceRules = getGtmData('sourceRules', defaultSourceRules);
      const promocode = getGtmData('promocode', defaultPromocode);
    
      // 2. Определение источника перехода
      let currentConfig = widgetConfig;
      let sourceButtonText = widgetConfig.buttonText;
      const utmSource = new URLSearchParams(window.location.search).get('utm_source');
      if (utmSource) {
        const matchingSource = sourceRules.find((rule) => rule.source === utmSource);
        if (matchingSource) {
          currentConfig = matchingSource;
          sourceButtonText = matchingSource.buttonText;
        }
      }
      const localStorageKey = 'smartWidgetState';
      let widgetState = getLocalStorageData(localStorageKey, {
        isOpen: false,
        currentSlide: 0,
        buttonText: sourceButtonText || widgetConfig.defaultButtonText, // Используем текст для кнопки из правил или дефолтный
      });
    
      // 3. Создание элементов виджета
      const widgetButton = createElement('button', {
        id: 'smart-widget-button',
        textContent: widgetState.buttonText, //Текст кнопки
        style: {
          position: 'fixed',
          bottom: '20px',
          right: '20px',
          backgroundColor: '#007bff',
          color: '#fff',
          padding: '10px 20px',
          borderRadius: '5px',
          cursor: 'pointer',
          zIndex: '1000',
          boxShadow: '0 2px 5px rgba(0,0,0,0.2)',
          transition: 'all 0.3s ease',
          border: 'none',
        },
      });
      widgetButton.addEventListener('mouseenter', () => {
        widgetButton.style.backgroundColor = '#0056b3';
        widgetButton.style.transform = 'scale(1.05)';
      });
      widgetButton.addEventListener('mouseleave', () => {
        widgetButton.style.backgroundColor = '#007bff';
        widgetButton.style.transform = 'scale(1)';
      });
    
      const widgetModal = createElement('div', {
        id: 'smart-widget-modal',
        style: {
          position: 'fixed',
          top: '50%',
          left: '50%',
          transform: 'translate(-50%, -50%)',
          backgroundColor: '#fff',
          padding: '20px',
          borderRadius: '5px',
          boxShadow: '0 4px 10px rgba(0,0,0,0.5)',
          zIndex: '1001',
          display: widgetState.isOpen ? 'block' : 'none', // Начальное состояние видимости
          maxWidth: '400px',
          width: '90%',
          transition: 'opacity 0.3s ease, visibility 0.3s ease',
        },
      });
    
      const modalContent = createElement('div', { id: 'smart-widget-modal-content' });
      widgetModal.appendChild(modalContent);
    
      const closeButton = createElement('button', {
        id: 'smart-widget-close-button',
        textContent: '×',
        style: {
          position: 'absolute',
          top: '10px',
          right: '10px',
          fontSize: '20px',
          cursor: 'pointer',
          border: 'none',
          backgroundColor: 'transparent',
        },
      });
      closeButton.addEventListener('click', () => {
        widgetState.isOpen = false;
        setLocalStorageData(localStorageKey, widgetState);
        widgetModal.style.display = 'none';
        widgetButton.style.display = 'block';
      });
      widgetModal.appendChild(closeButton);
    
      // 4. Функции для управления виджетом
      function renderSlide(slideIndex) {
        const slideData = currentConfig.slides[slideIndex];
        modalContent.innerHTML = ''; // Очищаем предыдущий контент
    
        const titleElement = createElement('h2', {
          textContent: slideData.title,
          style: { marginBottom: '10px' },
        });
        const descriptionElement = createElement('p', {
          textContent: slideData.description,
          style: { marginBottom: '20px' },
        });
        const buttonElement = createElement('button', {
          textContent: slideData.buttonText,
          style: {
            padding: '10px 20px',
            backgroundColor: '#007bff',
            color: '#fff',
            border: 'none',
            borderRadius: '5px',
            cursor: 'pointer',
            transition: 'background-color 0.3s ease',
            margin: '10px 0',
          },
        });
        buttonElement.addEventListener('mouseenter', () => {
          buttonElement.style.backgroundColor = '#0056b3';
        });
        buttonElement.addEventListener('mouseleave', () => {
          buttonElement.style.backgroundColor = '#007bff';
        });
    
        const imageElement = slideData.imageUrl
          ? createElement('img', {
              src: slideData.imageUrl,
              alt: slideData.title,
              style: {
                maxWidth: '100%',
                height: 'auto',
                marginBottom: '20px',
                borderRadius: '5px',
              },
            })
          : null;
    
        if (imageElement) {
          modalContent.appendChild(imageElement);
        }
        modalContent.appendChild(titleElement);
        modalContent.appendChild(descriptionElement);
    
        if (slideData.showPromocode && promocode) {
          const promocodeBlock = createElement('div', {
            style: {
              backgroundColor: '#f0f0f0',
              padding: '10px',
              borderRadius: '5px',
              margin: '10px 0',
              display: 'flex',
              justifyContent: 'space-between',
              alignItems: 'center',
            },
          });
          const promocodeText = createElement('span', {
            textContent: promocode,
            style: { fontWeight: 'bold', marginRight: '10px' },
          });
          const copyButton = createElement('button', {
            textContent: 'Копировать',
            style: {
              padding: '5px 10px',
              backgroundColor: '#28a745',
              color: '#fff',
              border: 'none',
              borderRadius: '5px',
              cursor: 'pointer',
              fontSize: '14px',
            },
          });
          copyButton.addEventListener('click', () => {
            navigator.clipboard.writeText(promocode)
              .then(() => {
                alert('Промокод скопирован!');
              })
              .catch((err) => {
                alert('Не удалось скопировать промокод!');
              });
          });
          promocodeBlock.appendChild(promocodeText);
          promocodeBlock.appendChild(copyButton);
          modalContent.appendChild(promocodeBlock);
        }
        modalContent.appendChild(buttonElement);
    
        if (slideIndex === 0) {
          const laterButton = createElement('button', {
            textContent: 'Позже',
            style: {
              padding: '10px 20px',
              backgroundColor: '#6c757d',
              color: '#fff',
              border: 'none',
              borderRadius: '5px',
              cursor: 'pointer',
              transition: 'background-color 0.3s ease',
              margin: '10px',
            },
          });
          laterButton.addEventListener('mouseenter', () => {
            laterButton.style.backgroundColor = '#5a6268';
          });
          laterButton.addEventListener('mouseleave', () => {
            laterButton.style.backgroundColor = '#6c757d';
          });
          laterButton.addEventListener('click', () => {
            widgetState.isOpen = false;
            setLocalStorageData(localStorageKey, widgetState);
            widgetModal.style.display = 'none';
            widgetButton.style.display = 'block';
          });
          modalContent.appendChild(laterButton);
          buttonElement.addEventListener('click', () => {
            widgetState.currentSlide = slideIndex + 1;
            setLocalStorageData(localStorageKey, widgetState);
            renderSlide(widgetState.currentSlide);
          });
        } else if (slideIndex < currentConfig.slides.length - 1) {
          buttonElement.addEventListener('click', () => {
            widgetState.currentSlide = slideIndex + 1;
            setLocalStorageData(localStorageKey, widgetState);
            renderSlide(widgetState.currentSlide);
          });
        } else {
          buttonElement.addEventListener('click', () => {
            widgetState.isOpen = false;
            widgetState.currentSlide = 0;
            if (currentConfig.slides[slideIndex].showPromocode) {
              widgetState.buttonText = promocode || widgetConfig.buttonTextPromocode;
              widgetButton.textContent = widgetState.buttonText;
            }
            setLocalStorageData(localStorageKey, widgetState);
            widgetModal.style.display = 'none';
            widgetButton.style.display = 'block';
          });
        }
      }
    
      function showModal() {
        widgetState.isOpen = true;
        setLocalStorageData(localStorageKey, widgetState);
        widgetModal.style.display = 'block';
        renderSlide(widgetState.currentSlide);
        widgetButton.style.display = 'none';
      }
    
      // 5. Добавление элементов на страницу и настройка обработчиков
      document.body.appendChild(widgetButton);
      document.body.appendChild(widgetModal);
    
      widgetButton.addEventListener('click', showModal);
    
      // 6. Отображение сохраненного состояния
      if (widgetState.isOpen) {
        showModal();
      }
    }
    
    // 7. Инициализация виджета при загрузке страницы
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initSmartWidget);
    } else {
      initSmartWidget();
    }
    </script>
