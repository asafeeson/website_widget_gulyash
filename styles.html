<script>
  // create style tag
  (function addWidgetStylesToHead() {
    var styles = document.createElement("style");
    styles.innerHTML =
      ":root{--main-color:darkorange;--secondary-color:white;--text-color:black;--overlay-color:rgba(0, 0, 0, 0.5);--button-text-shadow:rgba(0, 0, 0, 0.5);--image-border-color:orange;--modal-box-shadow:rgba(0, 0, 0, 0.3)}.modal-widget-floating-button{display:none;position:fixed;z-index:9999;font-family:Arial,sans-serif;cursor:pointer;width:fit;height:auto}.modal-widget-button-primary,.modal-widget-button-secondary{width:100%;padding:1rem 0;border-radius:.5rem;cursor:pointer}.modal-widget-button-primary{border:none;background-color:var(--main-color);font-weight:600;font-size:medium;color:var(--secondary-color);text-shadow:1px 1px 2px var(--button-text-shadow)}.modal-widget-button-primary:hover{background-color:#f08504}.modal-widget-button-secondary{border:2px solid var(--main-color);background-color:var(--secondary-color);color:var(--main-color)}.modal-widget-button-secondary:hover{background-color:var(--main-color);color:var(--secondary-color)}.modal-widget-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background-color:rgba(0,0,0,.2);z-index:9998}.modal-widget-modal-window{position:absolute;display:block;width:100%;max-width:390px;height:auto;top:50%;left:50%;translate:-50% -50%;background-color:var(--secondary-color);border-radius:1rem;color:var(--text-color);text-align:center;padding:1rem;box-shadow:0 5px 20px var(--modal-box-shadow);z-index:10000;overflow:hidden;animation:modalFadeIn .3s ease}@keyframes modalFadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}@keyframes slideInFromRight{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}@keyframes fadeOut{from{opacity:1}to{opacity:0}}@keyframes slideInRight{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}.modal-widget-header h3{margin:0;font-size:18px}.modal-widget-close{display:flex;align-items:center;justify-content:end}.modal-widget-close-svg{width:fit-content;cursor:pointer;padding:.2rem}.
